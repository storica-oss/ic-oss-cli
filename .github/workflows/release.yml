name: Build release binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: ic-oss-cli-linux-x86_64
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: ic-oss-cli-windows-x86_64
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: ic-oss-cli-macos-x86_64
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            asset: ic-oss-cli-macos-aarch64
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="dist/${{ matrix.asset }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/ic-oss-cli" "$package/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$package/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C "$package" .
          cd dist
          shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ic-oss-cli.exe" $package
          Copy-Item README.md, LICENSE-APACHE, LICENSE-MIT $package
          $archive = "dist/${{ matrix.asset }}.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content -Encoding ascii "${archive}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "ic-oss-cli $GITHUB_REF_NAME"
          fi
